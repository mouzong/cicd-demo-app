apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-demo-app
  template:
    metadata:
      labels:
        app: cicd-demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cicd-demo-pod
          image: ghcr.io/mouzong/cicd-demo-app:0b42911d0b43813abd44dc0edb8a4160f12446a4
          ports:
            - containerPort: 8080
