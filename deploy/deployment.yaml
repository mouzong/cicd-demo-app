apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-demo-app
  template:
    metadata:
      labels:
        app: cicd-demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cicd-demo-pod
          image: ghcr.io/mouzong/cicd-demo-app:efcaa7c3d1e5b5bb905d498d58500e84035bd383
          ports:
            - containerPort: 8080
