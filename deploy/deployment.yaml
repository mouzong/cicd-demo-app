apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo-app
  template:
    metadata:
      labels:
        app: cicd-demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cicd-demo-pod
          image: ghcr.io/mouzong/cicd-demo-app:e83d312f3a3f70a255b7da96aa88446d88d2970b
          ports:
            - containerPort: 8080
