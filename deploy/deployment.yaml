apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-demo-app
  template:
    metadata:
      labels:
        app: cicd-demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cicd-demo-pod
          image: ghcr.io/mouzong/cicd-demo-app:502fc50a3e5b7b017af1e88a9dd561efb307417c
          ports:
            - containerPort: 8080
